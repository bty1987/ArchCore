[project]
name = "archcore-collector"
version = "0.2.0"
description = "ArchCore 采集端：解密适配、白名单过滤、标准化上报、断点续传"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "zstandard>=0.23",  # 微信 4.x 消息内容 ZSTD 解压
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# 主轨真实数据源（需 Windows + 已登录微信环境，M0 验证项；不入默认依赖）
wxdump = ["pywxdump"]
# 实时轨（需 32 位 Python + 微信 3.9.12；默认不装）
wcf = ["wcferry"]

[project.scripts]
archcore-collector = "archcore_collector.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["DTZ"]  # ts 为微信本地 naive 时间（既定口径）

[tool.pytest.ini_options]
testpaths = ["tests"]
