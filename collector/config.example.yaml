# ArchCore 采集端配置示例：复制为 config.yaml 后填写真实值（config.yaml 不入 git）

server_base_url: http://127.0.0.1:8000
server_ingest_token: change-me-collector-token   # 与 server ARCHCORE_COLLECTOR_TOKEN 一致
collector_wxid: "wxid_xxxxx"                     # 采集号自身 wxid（sender_type=me 判定）

state_db: ./data/collector_state.db

source:
  type: fixture            # fixture（演示）| wechat4（4.x 主轨）| pywxdump（3.x 遗留，路线已终结）
  db_dir: ""               # wechat4：自研解密输出目录（先跑 scripts/decrypt_wechat4.py）；pywxdump：旧解密库目录
  fixture_path: ./data/fixture_wechat.db

whitelist:                 # F1-6 合规边界：白名单外数据不出微信目录
  allow_all: false         # 个人本机测试可设 true（采全部）；商用部署禁止开启
  groups: []               # 群 wx_id 精确名单（xxx@chatroom）
  group_name_patterns: []  # 群名正则，如 ['^ABC项目']
  allow_dm: true           # 采集号自身的客户单聊

schedule:
  incr_minutes: 60         # 增量周期（小时级准实时）
  flush_seconds: 30

padlocal:                  # 实时轨（可选，iPad 协议）：秒级推送，与解密轨互为备份
  enabled: false           # 需 PadLocal token；封号风险高于解密轨，小号先验证
  token: ""                # puppet_padlocal_xxx（或 rpachat 售出的服务 token）
  mode: direct             # direct=直连官方网关；service=网关化（自建/托管）
  endpoint: ""             # service 模式：WECHATY_PUPPET_SERVICE_ENDPOINT，如 127.0.0.1:9001
  authority: ""            # service 模式：托管服务发现地址（可选）
  no_tls: false            # service 模式：TLS 握手异常时置 true（WorkPro 实测需要）
  node: node
  bridge: ./padlocal_bridge/padlocal_bridge.mjs
  allow_dm: true


send_enabled: false        # 永久 false：归档系统只收不发
