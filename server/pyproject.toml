[project]
name = "archcore-server"
version = "0.2.0"
description = "ArchCore 平台服务端：采集入库、检索、客户映射、预警与通知"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.44",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
archcore-server = "archcore_server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "DTZ"]  # B008: FastAPI Depends 模式；DTZ: ts 为微信本地 naive 时间（既定口径）

[tool.pytest.ini_options]
testpaths = ["tests"]
